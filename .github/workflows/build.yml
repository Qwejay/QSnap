name: Build and Release QSnap

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动构建版本号 (例如: 1.1.0)'
        required: true
        default: '1.1.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          
          if (Test-Path "requirements.txt") {
              Write-Host "检测到 requirements.txt，正在安装依赖..."
              pip install -r requirements.txt
          } else {
              Write-Host "未找到 requirements.txt，使用内置依赖列表安装..."
              pip install PySide6 rapidocr-onnxruntime
          }
          
          pip install nuitka ordered-set zstandard

      - name: Convert SVG to ICO (ImageMagick)
        shell: pwsh
        run: |
          if (Test-Path "icon.svg") {
            Write-Host "发现 icon.svg，正在使用高密度采样生成超清多分辨率 icon.ico ..."
            magick.exe -density 1024 -background none icon.svg -define icon:auto-resize=256,128,64,48,32,16 icon.ico
          } else {
            Write-Host "未找到 icon.svg，跳过图标生成。"
          }

      - name: Resolve Target Version
        id: resolve_version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ORIGINAL_VER="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ORIGINAL_VER="${{ github.event.inputs.version }}"
          else
            ORIGINAL_VER="1.0.0-dev"
          fi
          
          CLEAN_VER=$(echo "$ORIGINAL_VER" | sed -E 's/^[vV]//g')
          
          METADATA_VER=$(echo "$CLEAN_VER" | cut -d'-' -f1)
          if [[ ! "$METADATA_VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            METADATA_VER="1.0.0"
          fi
          
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "metadata_version=$METADATA_VER" >> $GITHUB_OUTPUT

      - name: Sync & Extract Metadata from Code
        id: meta
        shell: python
        run: |
          import re
          import os

          version = "${{ steps.resolve_version.outputs.clean_version }}"
          filename = "main.py"
          
          if not os.path.exists(filename):
              print(f"Error: {filename} not found!")
              exit(1)
              
          with open(filename, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = re.sub(
              r'(__version__\s*=\s*["\'])[^"\']+(["\'])',
              f'\\g<1>{version}\\g<2>',
              content,
              count=1
          )
          with open(filename, 'w', encoding='utf-8') as f:
              f.write(content)
              
          metadata = {}
          for key in ["__app_name__", "__version__", "__author__", "__company__", "__description__"]:
              match = re.search(fr'{key}\s*=\s*["\']([^"\']+)["\']', content)
              metadata[key.strip("_")] = match.group(1) if match else ("QSnap" if key=="__app_name__" else "OpenSource")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              for k, v in metadata.items():
                  fh.write(f"{k}={v}\n")
          
          print(f"Extracted Metadata: {metadata}")

      - name: Build with Nuitka (Ultra Optimized & Force Data Injection)
        shell: python
        run: |
          import os
          import sys
          import subprocess
          import shutil

          app_name = "${{ steps.meta.outputs.app_name }}"
          company = "${{ steps.meta.outputs.company }}"
          author = "${{ steps.meta.outputs.author }}"
          desc = "${{ steps.meta.outputs.description }}"
          metadata_version = "${{ steps.resolve_version.outputs.metadata_version }}"
          version = "${{ steps.meta.outputs.version }}"

          cmd = [
              sys.executable, "-m", "nuitka",
              "--standalone",
              "--onefile",
              "--windows-console-mode=disable",
              "--enable-plugin=pyside6",
              "--enable-plugin=anti-bloat",
              "--lto=yes",                           
              "--noinclude-qt-translations",
              
              "--nofollow-import-to=PySide6.QtWebEngine",
              "--nofollow-import-to=PySide6.QtWebEngineCore",
              "--nofollow-import-to=PySide6.QtWebEngineWidgets",
              "--nofollow-import-to=PySide6.QtNetwork",
              "--nofollow-import-to=PySide6.QtQml",
              "--nofollow-import-to=PySide6.QtQuick",
              "--nofollow-import-to=PySide6.QtSql",
              "--nofollow-import-to=PySide6.QtTest",
              "--nofollow-import-to=PySide6.Qt3DCore",
              "--nofollow-import-to=PySide6.QtBluetooth",
              "--nofollow-import-to=PySide6.QtSensors",
              "--nofollow-import-to=matplotlib",
              "--nofollow-import-to=pandas",
              "--nofollow-import-to=scipy",
              "--nofollow-import-to=tkinter",
              
              f"--company-name={company}",
              f"--product-name={app_name}",
              f"--file-description={desc}",
              f"--copyright=Copyright (C) {author} All Rights Reserved.",
              f"--product-version={metadata_version}",
              f"--file-version={metadata_version}",
              
              "--output-dir=dist",
              "--clean-cache=all",
              "--remove-output",
              "--assume-yes-for-downloads"
          ]
          
          try:
              import rapidocr_onnxruntime
              ocr_path = os.path.dirname(rapidocr_onnxruntime.__file__)
              cmd.append(f"--include-data-dir={ocr_path}=rapidocr_onnxruntime")
              cmd.append("--include-package=rapidocr_onnxruntime")
              print(f"[Success] Found & Included RapidOCR Data & Package from: {ocr_path}")
          except ImportError:
              print("[Warning] rapidocr_onnxruntime not found!")

          try:
              import onnxruntime
              onnx_path = os.path.dirname(onnxruntime.__file__)
              cmd.append(f"--include-data-dir={onnx_path}=onnxruntime")
              cmd.append("--include-package=onnxruntime")
              print(f"[Success] Found & Included ONNXRuntime Data & Package from: {onnx_path}")
          except ImportError:
              print("[Warning] onnxruntime not found!")
              
          if os.path.exists("icon.ico"):
              cmd.append("--windows-icon-from-ico=icon.ico")
              
          cmd.append("main.py")
          
          print(f"\n[Executing Command] {' '.join(cmd)}\n")
          
          result = subprocess.run(cmd)
          if result.returncode != 0:
              print("\n[Error] Nuitka compilation failed!")
              sys.exit(1)
              
          dist_dir = "dist"
          expected_exe = os.path.join(dist_dir, "main.exe")
          
          if os.path.exists(expected_exe):
              final_exe_name = f"{app_name}_v{version}.exe"
              final_exe_path = os.path.join(dist_dir, final_exe_name)
              os.rename(expected_exe, final_exe_path)
              print(f"\n[Success] Generated single executable: {final_exe_path}")
              
              zip_name = f"{app_name}_v{version}_Windows_x64.zip"
              zip_path = os.path.join(dist_dir, zip_name)
              shutil.make_archive(zip_path.replace('.zip', ''), 'zip', dist_dir, final_exe_name)
              print(f"[Success] Generated release package: {zip_path}")
          else:
              print(f"\n[Error] Build failed: Expected {expected_exe} but it was not found!")
              sys.exit(1)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.app_name }}-Windows-x64
          path: |
            dist/*.zip
          retention-days: 7

      - name: Generate Changelog
        id: changelog
        shell: pwsh
        run: |
          $latestCommit = git log -1 --pretty=format:"- %s (%h)"
          "changelog<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $latestCommit | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: ${{ steps.meta.outputs.app_name }} v${{ steps.meta.outputs.version }}
          body: |
            ## 🚀 最新更新 (What's Changed)
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            *此版本由 GitHub Actions 自动化构建。*
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
